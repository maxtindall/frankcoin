[package]
name = "frankcoin"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "frankcoin"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
# `metadata` pulls in the Metaplex Token Metadata CPI helpers so the program can
# attach a name/symbol to its own mint (signing as the mint-authority PDA).
anchor-spl = { version = "1.0.2", features = ["metadata"] }
solana-keccak-hasher = "3.1.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-keccak-hasher = "3.1.0"
solana-pubkey = "3.0.0"
solana-account = "3.0.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
